services:
  - type: web
    name: mygrant-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_INVITE_DOMAIN
        value: parks.lacounty.gov
      - key: FRONTEND_URL
        sync: false
